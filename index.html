<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucas的六年级升级打怪工作台</title>
<style>
  :root{
    --bg:#e9f1fb;            /* 低饱和淡蓝主背景 */
    --sidebar:#2f6db0;       /* 蓝色导航栏 */
    --sidebar-dark:#285d96;
    --card:#ffffff;
    --text:#2b3a4a;
    --muted:#7a8aa0;
    --accent:#4a90d9;
    --ok:#3fae6b;            /* 已完成 */
    --ok-bg:#e6f7ee;
    --line:#d7e3f2;
    --warn:#e08a3c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
    background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
  }
  /* ---------- 左侧导航 ---------- */
  .sidebar{
    position:fixed;left:0;top:0;width:230px;height:100vh;
    background:var(--sidebar);color:#fff;overflow-y:auto;
    display:flex;flex-direction:column;
    box-shadow:2px 0 10px rgba(0,0,0,.08);z-index:20;
  }
  .brand{
    padding:18px 16px;font-weight:700;font-size:17px;
    background:var(--sidebar-dark);letter-spacing:.5px;
  }
  .brand small{display:block;font-weight:400;font-size:11px;opacity:.8;margin-top:4px;}
  .nav{padding:8px 0;flex:1;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:12px 18px;cursor:pointer;color:#eaf2fb;
    border-left:4px solid transparent;font-size:14.5px;user-select:none;
  }
  .nav-item:hover{background:rgba(255,255,255,.10);}
  .nav-item.active{background:rgba(255,255,255,.16);border-left-color:#fff;font-weight:600;}
  .nav-item .ic{font-size:17px;width:22px;text-align:center;}
  .nav-num{margin-left:auto;font-size:11px;opacity:.6;}
  .backup{padding:12px 16px;border-top:1px solid rgba(255,255,255,.15);font-size:12.5px;}
  .backup .btn{
    display:inline-block;margin:4px 4px 0 0;padding:6px 10px;border-radius:6px;
    background:rgba(255,255,255,.15);color:#fff;cursor:pointer;font-size:12px;border:none;
  }
  .backup .btn:hover{background:rgba(255,255,255,.28);}
  .hidden-file{display:none;}

  /* ---------- 主内容 ---------- */
  .main{margin-left:230px;padding:0 0 40px;}
  .topbar{
    position:sticky;top:0;background:rgba(233,241,251,.92);backdrop-filter:blur(6px);
    padding:14px 22px;border-bottom:1px solid var(--line);
    display:flex;flex-wrap:wrap;align-items:center;gap:14px;z-index:10;
  }
  .page-title{font-size:20px;font-weight:700;}
  .date-nav{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;}
  .date-nav button{
    width:34px;height:34px;border:none;border-radius:8px;background:#fff;color:var(--accent);
    font-size:18px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
  .date-nav button:hover{background:var(--accent);color:#fff;}
  .date-nav input[type=date]{
    border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;background:#fff;color:var(--text);
  }
  .weekday{font-weight:600;color:var(--sidebar);min-width:46px;}
  .chips{display:flex;gap:10px;width:100%;margin-top:2px;}
  .chip{background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 14px;font-size:13px;}
  .chip b{color:var(--accent);}

  .content{padding:22px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(40,90,150,.05);}
  .card h2{margin:0 0 14px;font-size:17px;}
  .card h3{margin:0 0 10px;font-size:14.5px;color:var(--sidebar);}
  .note{font-size:13px;color:var(--muted);background:#f4f8fd;border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin-top:6px;}

  /* 任务组与打卡 */
  .group{margin-bottom:18px;}
  .group-title{font-weight:700;font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
  .group-title .tag{font-size:11px;background:#eef4fb;color:var(--muted);padding:2px 8px;border-radius:10px;font-weight:500;}
  .items{display:flex;flex-wrap:wrap;gap:10px;}
  .task-btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;
    cursor:pointer;font-size:14px;color:var(--text);transition:.15s;user-select:none;
  }
  .task-btn:hover{border-color:var(--accent);}
  .task-btn .dot{width:18px;height:18px;border-radius:50%;border:2px solid #c2d3e6;display:inline-block;flex:none;}
  .task-btn.done{background:var(--ok-bg);border-color:var(--ok);color:#1f7a47;font-weight:600;}
  .task-btn.done .dot{background:var(--ok);border-color:var(--ok);position:relative;}
  .task-btn.done .dot::after{content:"✓";color:#fff;font-size:12px;position:absolute;left:2px;top:-2px;}
  .task-btn.add-other{border-style:dashed;color:var(--muted);font-weight:400;}
  .task-btn.add-other:hover{border-color:var(--accent);color:var(--accent);}
  .task-btn .del{
    margin-left:6px;width:22px;height:22px;border:none;border-radius:50%;
    background:rgba(224,138,60,.16);color:var(--warn);font-size:12px;line-height:1;
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none;
    padding:0;
  }
  .task-btn .del:hover{background:var(--warn);color:#fff;}

  .empty{color:var(--muted);font-size:14px;padding:18px;text-align:center;background:#f4f8fd;border-radius:12px;}

  /* 表格 */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line);}
  th{background:#f4f8fd;color:var(--sidebar);font-weight:600;}
  td.l,th.l{text-align:left;}
  tr.total td{font-weight:700;background:#f4f8fd;}

  /* 兑换 */
  .vouchers{display:flex;flex-wrap:wrap;gap:12px;}
  .voucher{
    flex:1 1 200px;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;text-align:center;
  }
  .voucher .v-name{font-weight:700;font-size:15px;margin-bottom:4px;}
  .voucher .v-cost{color:var(--warn);font-weight:700;margin-bottom:10px;}
  .voucher button{
    width:100%;padding:9px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px;
  }
  .voucher button:disabled{background:#c7d6e8;cursor:not-allowed;}
  .voucher button:hover:not(:disabled){background:var(--sidebar);}
  .ex-list{margin-top:6px;}
  .ex-item{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px dashed var(--line);font-size:14px;}

  /* 移动端 */
  @media(max-width:768px){
    .sidebar{position:fixed;top:0;left:0;width:100%;height:auto;max-height:46vh;flex-direction:column;}
    .brand{padding:10px 14px;}
    .nav{display:flex;flex-direction:row;overflow-x:auto;padding:0;}
    .nav-item{padding:10px 14px;white-space:nowrap;border-left:none;border-bottom:3px solid transparent;}
    .nav-item.active{border-left:none;border-bottom-color:#fff;}
    .nav-num{display:none;}
    .backup{display:none;}
    .main{margin-left:0;margin-top:0;padding-top:0;}
    .topbar{position:static;}
    .date-nav{margin-left:0;width:100%;}
  }

  /* 备份提醒弹窗 */
  .modal-mask{position:fixed;inset:0;background:rgba(20,40,70,.45);display:flex;align-items:center;justify-content:center;z-index:100;}
  .modal-box{background:#fff;border-radius:16px;padding:24px 22px;max-width:340px;width:86%;box-shadow:0 12px 40px rgba(0,0,0,.25);text-align:center;}
  .modal-emoji{font-size:38px;}
  .modal-title{font-size:18px;font-weight:700;margin:6px 0 8px;color:var(--sidebar);}
  .modal-text{font-size:14px;color:var(--text);line-height:1.6;margin-bottom:18px;}
  .modal-actions{display:flex;gap:10px;}
  .modal-actions button{flex:1;padding:11px;border:none;border-radius:10px;font-size:14.5px;cursor:pointer;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--sidebar);}
  .btn-ghost{background:#eef3fa;color:var(--muted);}
  .btn-ghost:hover{background:#e2eaf5;}
</style>
</head>
<body>
  <div class="sidebar">
    <div class="brand">Lucas的学习工作台<small>六年级 · 升级打怪</small></div>
    <div class="nav" id="nav"></div>
    <div class="backup">
      <div>数据备份（换设备用）</div>
      <button class="btn" data-act="export">导出数据</button>
      <button class="btn" data-act="import">导入数据</button>
      <input type="file" id="importFile" class="hidden-file" accept="application/json">
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="page-title" id="pageTitle">语文</div>
      <div class="date-nav">
        <button data-act="prev" title="前一天">‹</button>
        <input type="date" id="dateInput">
        <button data-act="next" title="后一天">›</button>
        <span class="weekday" id="weekdayLabel"></span>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="content" id="content"></div>
  </div>

  <div id="backupModal" class="modal-mask" style="display:none;">
    <div class="modal-box">
      <div class="modal-emoji">💾</div>
      <div class="modal-title">备份提醒</div>
      <div class="modal-text" id="backupText"></div>
      <div class="modal-actions">
        <button class="btn-primary" data-act="exportAndClose">立即导出</button>
        <button class="btn-ghost" data-act="closeBackup">稍后提醒</button>
      </div>
    </div>
  </div>

<script>
/* =========================================================
   Lucas 六年级升级打怪工作台  ——  单文件版
   说明：
   - 全部数据保存在浏览器 localStorage（本机本浏览器）。
   - 换设备请用左侧“导出数据/导入数据”搬运记录。
   - 任务结构在 SUBJECTS 里，可自由增删小项目。
   - 打卡从 2026-09-01 开始；周末作业仅周六日，钢琴仅周一至周五。
   ========================================================= */

const START = '2026-09-01';
const END   = '2027-08-31';
const STORE_KEY = 'lucas_workbench_v1';

/* ---------- 任务配置（小项目自动编号 a) b) c) …）---------- */
const SUBJECTS = {
  chinese: { name:'语文', icon:'📖', groups:[
    {key:'A', label:'校内作业', items:['书面作业','背诵作业','默写作业']},
    {key:'B', label:'家庭作业', items:['涂重点（预习）','默写小达人','其他']},
    {key:'C', label:'周末作业', items:['文言文虚词背默','文言文实词背默','古诗文背诵','复习卷','错题复习'], weekendsOnly:true},
    {key:'D', label:'每日阅读', items:['每日阅读']},
  ]},
  math: { name:'数学', icon:'➗', groups:[
    {key:'校内', label:'校内作业', items:['书面作业']},
    {key:'校外', label:'校外作业', items:['新舟（课堂巩固）','新舟（加油站）']},
    {key:'家庭', label:'家庭作业', items:['计算题','新思路','市北','一课一练','其他']},
    {key:'周末', label:'周末作业', items:['复习卷','错题复习'], weekendsOnly:true},
  ]},
  english: { name:'英语', icon:'🔤', groups:[
    {key:'A', label:'校内作业', items:['书面作业','背诵作业','默写作业']},
    {key:'B', label:'家庭作业', items:['一课一练']},
    {key:'C', label:'周末作业', items:['时文阅读','中考单词词组背默','阅读','复习卷','错题集'], weekendsOnly:true},
  ]},
  piano: { name:'钢琴', icon:'🎹', weekdaysOnly:true, groups:[
    {key:'练习', label:'练习内容', items:['音阶/琶音练习','曲目练习','其他']},
  ]},
  housework: { name:'家务', icon:'🧹', groups:[
    {key:'家务', label:'家务内容', items:['整理自己的房间','洗碗/擦桌子','倒垃圾','其他']},
  ]},
};

/* 兑换券定义 */
const VOUCHERS = [
  {id:'stationery', name:'文具券',      cost:20},
  {id:'freetime',   name:'自由时间券',  cost:20},
  {id:'weekend',    name:'周末享乐券',  cost:20},
  {id:'cash',       name:'现金券（10积分=5元）', cost:10},
];
const WISH_COST = 50;

/* 菜单（按需求顺序，含两个“8”已顺延为 8/9） */
const MENU = [
  {view:'chinese',   icon:'📖', label:'语文'},
  {view:'math',      icon:'➗', label:'数学'},
  {view:'english',   icon:'🔤', label:'英语'},
  {view:'piano',     icon:'🎹', label:'钢琴'},
  {view:'housework', icon:'🧹', label:'家务'},
  {view:'week',      icon:'📅', label:'本周积分小结'},
  {view:'month',     icon:'📊', label:'本月积分小结'},
  {view:'settle',    icon:'🎁', label:'本月积分结算兑换'},
  {view:'year',      icon:'🏆', label:'本年度积分总结'},
];

/* ---------- 工具函数 ---------- */
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function fmtDate(dt){const y=dt.getFullYear();const m=String(dt.getMonth()+1).padStart(2,'0');const d=String(dt.getDate()).padStart(2,'0');return y+'-'+m+'-'+d;}
function addDays(s,n){const dt=parseDate(s);dt.setDate(dt.getDate()+n);return fmtDate(dt);}
function weekdayName(s){return ['周日','周一','周二','周三','周四','周五','周六'][parseDate(s).getDay()];}
function isWeekend(s){const d=parseDate(s).getDay();return d===0||d===6;}
function ymOf(s){return s.slice(0,7);}
function yearOf(s){return s.slice(0,4);}
function clampDate(s){if(s<START)return START;if(s>END)return END;return s;}
function weekStart(s){const dt=parseDate(s);const day=dt.getDay();const diff=(day===0?-6:1-day);dt.setDate(dt.getDate()+diff);return fmtDate(dt);}
function datesInMonth(ym){const [y,m]=ym.split('-').map(Number);const n=new Date(y,m,0).getDate();const r=[];for(let d=1;d<=n;d++){const s=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');if(s>=START&&s<=END)r.push(s);}return r;}
function letter(i){return String.fromCharCode(97+i)+')';} // 0->a) 1->b) ...

/* ---------- 状态 ---------- */
let state = load();
if(state.backupMilestone===undefined) state.backupMilestone=Math.floor(totalEarned()/10);
migrate();
let currentView = 'chinese';
let selectedDate = clampDate(today());

function today(){const d=new Date();return fmtDate(d);}
function load(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){const o=JSON.parse(raw);return Object.assign({records:{},exchanges:{},custom:{}},o);}
  }catch(e){}
  return {records:{},exchanges:{},custom:{}};
}
/* 兼容旧版：把单条“其他”记录迁移为自定义条目 */
function migrate(){
  for(const d in state.records){
    for(const k in state.records[d]){
      if(state.records[d][k] && itemTextOf(k)==='其他'){
        const p=k.split('|');const subj=p[0],group=p[1];
        if(!state.custom[d])state.custom[d]={};
        if(!state.custom[d][subj+'|'+group])state.custom[d][subj+'|'+group]=[];
        if(state.custom[d][subj+'|'+group].length<10)state.custom[d][subj+'|'+group].push({text:'',done:true});
        delete state.records[d][k];
      }
    }
  }
}
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state));}

/* ---------- 打卡与积分核心 ---------- */
function itemKey(subj,group,idx){return subj+'|'+group+'|'+letter(idx);}
function isChecked(date,key){return !!(state.records[date]&&state.records[date][key]);}
function itemTextOf(key){
  const p=key.split('|');const subj=p[0],group=p[1],letter=p[2];
  const subjObj=SUBJECTS[subj];if(!subjObj)return '';
  const g=(subjObj.groups||[]).find(x=>x.key===group);if(!g)return '';
  const idx=letter.charCodeAt(0)-97;
  return (g.items[idx])||'';
}
function toggle(date,key){
  if(!state.records[date])state.records[date]={};
  const wasDone=!!state.records[date][key];
  if(wasDone){
    delete state.records[date][key];
  }else{
    if(itemTextOf(key)==='其他'){
      let custom='';
      if(state.custom&&state.custom[date]&&state.custom[date][key]){
        custom=state.custom[date][key];
      }else{
        custom=prompt('请填写“其他”的具体内容：','');
        if(custom===null)return; // 取消则不打卡
        custom=custom.trim();
      }
      if(!state.custom)state.custom={};
      if(!state.custom[date])state.custom[date]={};
      state.custom[date][key]=custom;
    }
    state.records[date][key]=true;
  }
  save();
  checkBackupReminder();
  render();
}


/* 自定义“其他”多条目（每科每组最多10条） */
function addOther(subj,group){
  const text=(prompt('请填写“其他”的具体内容：','')||'').trim();
  if(!text)return;
  const d=selectedDate;
  if(!state.custom[d])state.custom[d]={};
  if(!state.custom[d][subj+'|'+group])state.custom[d][subj+'|'+group]=[];
  if(state.custom[d][subj+'|'+group].length>=10)return;
  state.custom[d][subj+'|'+group].push({text:text,done:true});
  save();checkBackupReminder();render();
}
function toggleOther(subj,group,idx){
  const d=selectedDate;
  const arr=(state.custom[d]&&state.custom[d][subj+'|'+group])||[];
  if(!arr[idx])return;
  arr[idx].done=!arr[idx].done;
  save();checkBackupReminder();render();
}
function delOther(subj,group,idx){
  if(!confirm('确定删除这条“其他”吗？\n删除后该条内容与打卡积分都会取消，且无法恢复。'))return;
  const d=selectedDate;
  const arr=(state.custom[d]&&state.custom[d][subj+'|'+group])||[];
  if(!arr[idx])return;
  arr.splice(idx,1); // 删除后其余自动重新编号（其他1/其他2…）
  save();render();
}

/* 某天所有可见小项目是否完成计数（按当前日期条件过滤） */
function visibleGroups(subjKey,date){
  const subj=SUBJECTS[subjKey];const out=[];
  for(const g of subj.groups){
    if(g.weekendsOnly&&!isWeekend(date))continue;
    if(subj.weekdaysOnly&&isWeekend(date))continue;
    out.push(g);
  }
  return out;
}
function customEntries(date,subj,group){
  const m=(state.custom&&state.custom[date]&&state.custom[date][subj+'|'+group])||[];
  return m;
}
function earnedForGroup(date,subj,group){
  const g=(SUBJECTS[subj].groups||[]).find(x=>x.key===group);if(!g)return 0;
  let n=0;
  g.items.forEach((it,i)=>{
    if(it==='其他'){ n+=customEntries(date,subj,group).filter(e=>e.done).length; }
    else if(isChecked(date,itemKey(subj,group,i))) n++;
  });
  return n;
}
function earnedForDate(date){
  let n=0;
  for(const sk in SUBJECTS){
    for(const g of visibleGroups(sk,date)){ n+=earnedForGroup(date,sk,g.key); }
  }
  return n;
}
function earnedForDateBySubject(date){
  const map={};
  for(const sk in SUBJECTS){
    let n=0;
    for(const g of visibleGroups(sk,date)){ n+=earnedForGroup(date,sk,g.key); }
    if(n>0||someVisible(sk,date))map[sk]=n;
  }
  return map;
}
function someVisible(sk,date){return visibleGroups(sk,date).length>0;}
function earnedForMonth(ym){let n=0;for(const d of datesInMonth(ym))n+=earnedForDate(d);return n;}
function spentForMonth(ym){let n=0;const arr=state.exchanges[ym]||[];for(const e of arr)n+=e.cost;return n;}
function available(ym){return Math.max(0,earnedForMonth(ym)-spentForMonth(ym));}

/* 累计赚得积分（终身，用于备份提醒） */
function totalEarned(){
  let n=0;
  for(const d in state.records){const rec=state.records[d];for(const k in rec){if(rec[k])n++;}}
  for(const d in (state.custom||{})){
    const md=state.custom[d];
    for(const gk in md){ for(const e of md[gk]){ if(e&&e.done) n++; } }
  }
  return n;
}
/* 每攒满 10 个积分弹窗提醒备份 */
function checkBackupReminder(){
  const te=totalEarned();
  const m=Math.floor(te/10);
  if(m>0 && m>(state.backupMilestone||0)){
    state.backupMilestone=m;save();
    showBackupReminder(m*10);
  }
}
function showBackupReminder(points){
  document.getElementById('backupText').textContent='你已经攒到 '+points+' 个积分啦！为防止数据丢失，建议现在导出一份备份（JSON 文件存到网盘即可）。';
  document.getElementById('backupModal').style.display='flex';
}
function closeBackup(){document.getElementById('backupModal').style.display='none';}

/* ---------- 渲染：导航 ---------- */
function renderNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML='';
  MENU.forEach((m,i)=>{
    const el=document.createElement('div');
    el.className='nav-item'+(currentView===m.view?' active':'');
    el.dataset.act='nav';el.dataset.view=m.view;
    el.innerHTML='<span class="ic">'+m.icon+'</span><span>'+m.label+'</span><span class="nav-num">'+(i+1)+'</span>';
    nav.appendChild(el);
  });
}

/* ---------- 渲染：顶栏 ---------- */
function renderTop(){
  document.getElementById('pageTitle').textContent=MENU.find(m=>m.view===currentView).label;
  document.getElementById('dateInput').value=selectedDate;
  document.getElementById('dateInput').min=START;
  document.getElementById('dateInput').max=END;
  document.getElementById('weekdayLabel').textContent=weekdayName(selectedDate);
  const ym=ymOf(selectedDate);
  const chips=document.getElementById('chips');
  chips.innerHTML='<span class="chip">本月可用积分：<b>'+available(ym)+'</b></span>'+
                  '<span class="chip">本年累计赚得：<b>'+earnedForYear(yearOf(selectedDate))+'</b></span>';
}
function earnedForYear(y){
  let n=0;
  for(let m=1;m<=12;m++){const ym=y+'-'+String(m).padStart(2,'0');n+=earnedForMonth(ym);}
  return n;
}

/* ---------- 渲染：科目打卡页 ---------- */
function renderSubject(subjKey){
  const subj=SUBJECTS[subjKey];
  const c=document.getElementById('content');
  const groups=visibleGroups(subjKey,selectedDate);
  if(subj.weekdaysOnly&&isWeekend(selectedDate)){
    c.innerHTML='<div class="card"><div class="empty">🎹 今天休息，没有钢琴任务（钢琴仅周一至周五）。<br>去玩一会儿吧！</div></div>';
    return;
  }
  let html='<div class="card"><h2>'+subj.icon+' '+subj.name+' · 打卡</h2>';
  html+='<div class="note">📅 '+fmtCn(selectedDate)+'（'+weekdayName(selectedDate)+'）　每个小项目完成即 +1 积分。</div>';
  groups.forEach(g=>{
    html+='<div class="group"><div class="group-title">'+g.label;
    if(g.weekendsOnly)html+='<span class="tag">仅周末</span>';
    html+='</div><div class="items">';
    g.items.forEach((it,i)=>{
      const key=itemKey(subjKey,g.key,i);
      if(it==='其他'){
        const entries=customEntries(selectedDate,subjKey,g.key);
        entries.forEach((e,idx)=>{
          html+='<div class="task-btn'+(e.done?' done':'')+'" data-act="toggleOther" data-subj="'+subjKey+'" data-group="'+g.key+'" data-idx="'+idx+'">'+
                '<span class="dot"></span>其他'+(idx+1)+'：'+(e.text||'')+
                '<button class="del" title="删除这条" data-act="delOther" data-subj="'+subjKey+'" data-group="'+g.key+'" data-idx="'+idx+'">✕</button>'+
                '</div>';
        });
        if(entries.length<10){
          html+='<div class="task-btn add-other" data-act="addOther" data-subj="'+subjKey+'" data-group="'+g.key+'">＋ 添加其他'+(entries.length+1)+'</div>';
        }
        return;
      }
      const done=isChecked(selectedDate,key);
      html+='<div class="task-btn'+(done?' done':'')+'" data-act="toggle" data-date="'+selectedDate+'" data-key="'+key+'">'+
            '<span class="dot"></span>'+it+'</div>';
    });
    html+='</div></div>';
  });
  // 周末作业提示（工作日时）
  if(!isWeekend(selectedDate)&&subj.groups.some(g=>g.weekendsOnly)){
    html+='<div class="note">💡 周末作业（文言文/复习卷/错题等）仅在周六、周日出现。</div>';
  }
  if(subjKey==='piano'){
    html+='<div class="note">💡 钢琴任务仅在周一至周五出现，周末休息。</div>';
  }
  html+='</div>';
  c.innerHTML=html;
}
function fmtCn(s){const [y,m,d]=s.split('-').map(Number);return y+'年'+m+'月'+d+'日';}

/* ---------- 渲染：本周小结 ---------- */
function renderWeek(){
  const ws=weekStart(selectedDate);
  const c=document.getElementById('content');
  let html='<div class="card"><h2>📅 本周积分小结</h2>';
  html+='<div class="note">统计周期：'+fmtCn(ws)+'（周一） ~ '+fmtCn(addDays(ws,6))+'（周日），依据当前所选日期 '+fmtCn(selectedDate)+'。</div>';
  html+='<table><thead><tr><th class="l">日期</th><th>星期</th><th>语文</th><th>数学</th><th>英语</th><th>钢琴</th><th>家务</th><th>当日合计</th></tr></thead><tbody>';
  let tot=0;const subjTot={chinese:0,math:0,english:0,piano:0,housework:0};
  for(let i=0;i<7;i++){
    const d=addDays(ws,i);
    if(d<START||d>END)continue;
    const by=earnedForDateBySubject(d);
    const dayTot=earnedForDate(d);tot+=dayTot;
    for(const k in subjTot)subjTot[k]+=(by[k]||0);
    html+='<tr><td class="l">'+fmtCn(d)+'</td><td>'+weekdayName(d).replace('周','周')+'</td>'+
      '<td>'+(by.chinese||0)+'</td><td>'+(by.math||0)+'</td><td>'+(by.english||0)+'</td><td>'+(by.piano||0)+'</td><td>'+(by.housework||0)+'</td><td><b>'+dayTot+'</b></td></tr>';
  }
  html+='<tr class="total"><td class="l">本周合计</td><td></td><td>'+subjTot.chinese+'</td><td>'+subjTot.math+'</td><td>'+subjTot.english+'</td><td>'+subjTot.piano+'</td><td>'+subjTot.housework+'</td><td>'+tot+'</td></tr>';
  html+='</tbody></table></div>';
  c.innerHTML=html;
}

/* ---------- 渲染：本月小结 ---------- */
function renderMonth(){
  const ym=ymOf(selectedDate);
  const c=document.getElementById('content');
  let html='<div class="card"><h2>📊 本月积分小结（'+ym+'）</h2>';
  html+='<div class="note">统计月份依据当前所选日期 '+fmtCn(selectedDate)+'。</div>';
  const days=datesInMonth(ym);
  html+='<table><thead><tr><th class="l">日期</th><th>星期</th><th>当日积分</th></tr></thead><tbody>';
  let tot=0;const perDay=[];
  days.forEach(d=>{const t=earnedForDate(d);tot+=t;perDay.push(t);
    html+='<tr><td class="l">'+fmtCn(d)+'</td><td>'+weekdayName(d)+'</td><td>'+(t>0?'<b>'+t+'</b>':t)+'</td></tr>';});
  html+='<tr class="total"><td class="l" colspan="2">本月累计赚得</td><td>'+tot+'</td></tr>';
  html+='</tbody></table>';
  const spent=spentForMonth(ym);
  html+='<div class="card" style="margin-top:16px;"><h3>积分结算概览</h3>';
  html+='<table><tbody>'+
    '<tr><td class="l">本月赚得积分</td><td><b>'+tot+'</b></td></tr>'+
    '<tr><td class="l">本月已兑换/愿望消耗</td><td>'+spent+'</td></tr>'+
    '<tr class="total"><td class="l">本月可用（剩余）积分</td><td>'+available(ym)+'</td></tr>'+
    '</tbody></table>';
  html+='<div class="note">⚠️ 每月剩余积分不延续到次月。请在「本月积分结算兑换」里及时使用。</div>';
  html+='</div>';
  c.innerHTML=html;
}

/* ---------- 渲染：本月结算兑换 ---------- */
function renderSettle(){
  const ym=ymOf(selectedDate);
  const c=document.getElementById('content');
  const avail=available(ym);
  const wishes=Math.floor(avail/WISH_COST);
  let html='<div class="card"><h2>🎁 本月积分结算兑换（'+ym+'）</h2>';
  html+='<div class="note">每选择一张兑换券即扣除当月相应积分；现金券 10 积分 = 5 元。剩余积分不延续至次月，请当月用完。</div>';
  html+='<div style="margin:14px 0;font-size:15px;">本月可用积分：<b style="color:var(--accent);font-size:20px;">'+avail+'</b>　|　可满足愿望：<b style="color:var(--warn);">'+wishes+'</b> 个（每 50 积分 1 个）</div>';
  html+='<div class="vouchers">';
  VOUCHERS.forEach(v=>{
    const dis=avail<v.cost?'disabled':'';
    html+='<div class="voucher"><div class="v-name">'+v.name+'</div><div class="v-cost">'+v.cost+' 积分</div>'+
      '<button data-act="voucher" data-id="'+v.id+'" '+dis+'>兑换</button></div>';
  });
  html+='</div>';
  const wishDis=avail<WISH_COST?'disabled':'';
  html+='<div style="margin-top:16px;"><button data-act="wish" '+wishDis+' style="padding:12px 22px;border:none;border-radius:10px;background:var(--warn);color:#fff;font-size:15px;cursor:pointer;">🎉 满足一个愿望（消耗 '+WISH_COST+' 积分）</button></div>';
  // 兑换记录
  const arr=state.exchanges[ym]||[];
  html+='<div class="card" style="margin-top:16px;"><h3>本月兑换记录</h3>';
  if(arr.length===0)html+='<div class="ex-item"><span>还没有兑换记录</span></div>';
  else{
    html+='<div class="ex-list">';
    arr.slice().reverse().forEach(e=>{html+='<div class="ex-item"><span>'+e.name+'</span><span>-'+e.cost+' 积分　'+e.ts+'</span></div>';});
    html+='</div>';
  }
  html+='</div></div>';
  c.innerHTML=html;
}
function doVoucher(id){
  const v=VOUCHERS.find(x=>x.id===id);const ym=ymOf(selectedDate);
  if(available(ym)<v.cost)return;
  if(!state.exchanges[ym])state.exchanges[ym]=[];
  state.exchanges[ym].push({name:v.name,cost:v.cost,ts:nowStr()});
  save();render();
}
function doWish(){
  const ym=ymOf(selectedDate);
  if(available(ym)<WISH_COST)return;
  if(!state.exchanges[ym])state.exchanges[ym]=[];
  state.exchanges[ym].push({name:'满足一个愿望',cost:WISH_COST,ts:nowStr()});
  save();render();
}
function nowStr(){const d=new Date();return fmtDate(d)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}

/* ---------- 渲染：本年度总结 ---------- */
function renderYear(){
  const y=yearOf(selectedDate);
  const c=document.getElementById('content');
  let html='<div class="card"><h2>🏆 本年度积分总结（'+y+' 年）</h2>';
  html+='<div class="note">统计年份依据当前所选日期 '+fmtCn(selectedDate)+'。每月积分独立结算，不跨月累计；此处展示全年累计赚得与消耗。</div>';
  html+='<table><thead><tr><th class="l">月份</th><th>赚得</th><th>兑换/愿望消耗</th><th>当月剩余</th></tr></thead><tbody>';
  let totE=0,totS=0;
  for(let m=1;m<=12;m++){
    const ym=y+'-'+String(m).padStart(2,'0');
    // 仅显示与学期有交集的月份
    const days=datesInMonth(ym);if(days.length===0)continue;
    const e=earnedForMonth(ym);const s=spentForMonth(ym);const a=Math.max(0,e-s);
    totE+=e;totS+=s;
    html+='<tr><td class="l">'+ym+'</td><td>'+e+'</td><td>'+s+'</td><td>'+a+'</td></tr>';
  }
  html+='<tr class="total"><td class="l">全年合计</td><td>'+totE+'</td><td>'+totS+'</td><td>'+(totE-totS)+'</td></tr>';
  html+='</tbody></table>';
  // 兑换明细
  let voucherCount=0,wishCount=0,cashCount=0;
  for(let m=1;m<=12;m++){const ym=y+'-'+String(m).padStart(2,'0');(state.exchanges[ym]||[]).forEach(e=>{if(e.name==='满足一个愿望')wishCount++;else if(e.name.indexOf('现金券')>=0)cashCount++;else voucherCount++;});}
  html+='<div class="card" style="margin-top:16px;"><h3>全年战利品</h3>';
  html+='<div class="note">🎖️ 累计赚得 <b>'+totE+'</b> 积分　|　兑换各类券 <b>'+voucherCount+'</b> 张　|　满足愿望 <b>'+wishCount+'</b> 个　|　现金券 <b>'+cashCount+'</b> 张（'+(cashCount*5)+' 元）</div>';
  // 段位
  html+='<div class="note">🎮 升级打怪段位：'+rank(totE)+'</div>';
  html+='</div></div>';
  c.innerHTML=html;
}
function rank(tot){
  if(tot>=1000)return '🥇 学神（1000+）';
  if(tot>=600)return '🥈 学霸（600+）';
  if(tot>=300)return '🥉 进阶战士（300+）';
  if(tot>=100)return '⚔️ 新手骑士（100+）';
  return '🌱 萌新勇者（0+）';
}

/* ---------- 主渲染 ---------- */
function render(){
  renderNav();renderTop();
  if(['chinese','math','english','piano','housework'].includes(currentView))renderSubject(currentView);
  else if(currentView==='week')renderWeek();
  else if(currentView==='month')renderMonth();
  else if(currentView==='settle')renderSettle();
  else if(currentView==='year')renderYear();
}

/* ---------- 事件委托 ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;
  if(act==='nav'){currentView=el.dataset.view;render();window.scrollTo(0,0);}
  else if(act==='prev'){selectedDate=clampDate(addDays(selectedDate,-1));render();}
  else if(act==='next'){selectedDate=clampDate(addDays(selectedDate,1));render();}
  else if(act==='toggle'){toggle(el.dataset.date,el.dataset.key);}
  else if(act==='addOther'){addOther(el.dataset.subj,el.dataset.group);}
  else if(act==='toggleOther'){toggleOther(el.dataset.subj,el.dataset.group,parseInt(el.dataset.idx,10));}
  else if(act==='delOther'){delOther(el.dataset.subj,el.dataset.group,parseInt(el.dataset.idx,10));}
  else if(act==='voucher'){doVoucher(el.dataset.id);}
  else if(act==='wish'){doWish();}
  else if(act==='closeBackup'){closeBackup();}
  else if(act==='exportAndClose'){exportData();closeBackup();}
  else if(act==='export'){exportData();}
  else if(act==='import'){document.getElementById('importFile').click();}
});
document.getElementById('dateInput').addEventListener('change',e=>{
  if(e.target.value)selectedDate=clampDate(e.target.value);render();
});
document.getElementById('importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(o&&o.records){state=Object.assign({records:{},exchanges:{},custom:{},backupMilestone:0},o);if(state.backupMilestone===undefined)state.backupMilestone=Math.floor(totalEarned()/10);save();render();alert('导入成功！');}else alert('文件格式不正确');}catch(err){alert('导入失败：'+err.message);}};
  r.readAsText(f);
  e.target.value='';
});
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='Lucas学习工作台_数据备份_'+fmtDate(new Date())+'.json';
  a.click();URL.revokeObjectURL(a.href);
}

/* 启动 */
render();
</script>
</body>
</html>
